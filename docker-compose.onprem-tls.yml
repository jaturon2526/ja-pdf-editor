# docker-compose.onprem-tls.yml — เปิดเว็บแบบ HTTPS ด้วยใบรับรอง TLS ขององค์กร (ติดตั้งในองค์กร / on-premise)
# ใช้ "ซ้อน" กับ docker-compose.prod.yml (+ docker-compose.onprem-build.yml บนเซิร์ฟเวอร์ x86_64):
#   docker compose --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.onprem-build.yml \
#     -f docker-compose.onprem-tls.yml up -d --build
# เปิดให้เข้าจาก internet: ใช้ใบรับรองจาก CA สาธารณะ (Let's Encrypt ฯลฯ) — ใบจาก CA ภายในใช้ได้เฉพาะเครื่องขององค์กร
#
# ทำไมต้อง HTTPS: passkey (WebAuthn) ใช้ได้เฉพาะเว็บ https และการเข้าสู่ระบบส่งรหัสผ่านผ่านเครือข่าย
# ไม่ต้องใช้ไฟล์นี้ ถ้าองค์กรมี reverse proxy / load balancer ที่ทำ HTTPS ให้อยู่แล้ว (ชี้ไปที่พอร์ต 80 ของเครื่องนี้)
#
# วางไฟล์ใบรับรองไว้ข้างไฟล์นี้ (ไม่เข้า git):
#   ./secrets/tls/fullchain.pem   ใบรับรองของเว็บ + intermediate ของ CA องค์กร (PEM ต่อกัน ใบของเว็บอยู่บนสุด)
#   ./secrets/tls/privkey.pem     private key (ไม่มีรหัสผ่าน) — chmod 600
# ใบรับรองต้องออกให้ชื่อโดเมนเดียวกับ FRONTEND_URL และเครื่องผู้ใช้ต้องเชื่อถือ CA ที่ออก (CA ภายใน: ติดตั้งผ่าน GPO/MDM)
# ต่ออายุใบรับรอง: วางไฟล์ใหม่ทับแล้ว  docker compose ... restart tls
#
# ต้องย้ายพอร์ตหน้าเว็บออกจาก 80 ก่อน (ไม่งั้นชนกับ tls) — ใส่ใน .env.prod:  FRONTEND_BIND=127.0.0.1:8081
#   (deploy.sh ตั้งให้เองเมื่อใช้ไฟล์นี้) · เดิมใช้ ports: !reset ซึ่ง podman-compose และ Compose < 2.24 ไม่รองรับ
services:
  tls:
    # จำกัดขนาด log ของ container (ค่าเริ่มต้นของ Docker โตไม่จำกัดจนดิสก์เต็มได้) — Docker/Podman รองรับ max-size
    logging:
      options:
        max-size: "20m"
    image: docker.io/nginx:1.27-alpine
    container_name: pdf_tls_prod
    restart: always
    environment:
      - TZ=Asia/Bangkok
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/onprem/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tls:/etc/nginx/tls:ro
    depends_on:
      - frontend
