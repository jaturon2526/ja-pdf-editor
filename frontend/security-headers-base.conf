# Security headers พื้นฐาน (ทุกคำตอบ) — ใช้ผ่าน security-headers.conf (ซึ่งเพิ่ม CSP) · SSL Labs ให้ A+ เมื่อมี HSTS ≥ 6 เดือน
# nginx: location ที่มี add_header ของตัวเองจะ "ไม่สืบทอด" add_header ของ server → ต้อง include security-headers.conf ซ้ำใน location นั้นด้วย
# HSTS ผ่าน HTTP ธรรมดาเบราว์เซอร์ไม่สนใจ (on-prem ที่ยังไม่มี HTTPS ไม่กระทบ) · ไม่ใส่ includeSubDomains/preload
# เพราะโดเมนย่อยอื่นขององค์กรอาจยังไม่มี HTTPS
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
