<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cl-docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1e6e"/>
      <stop offset="100%" stop-color="#060c30"/>
    </linearGradient>
    <linearGradient id="cl-foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0d2060"/>
    </linearGradient>

    <!-- Glow filter for border -->
    <filter id="cl-edgeGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- J white-blue glow -->
    <filter id="cl-jGlow" x="-35%" y="-25%" width="170%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feFlood flood-color="#93c5fd" flood-opacity="0.8" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- A amber glow -->
    <filter id="cl-aGlow" x="-35%" y="-25%" width="170%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feFlood flood-color="#f97316" flood-opacity="0.9" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Orb glow -->
    <filter id="cl-orbGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Document body -->
  <path d="M 80 24 L 348 24 L 444 120 L 444 492 C 444 503 435 512 424 512 L 88 512 C 77 512 68 503 68 492 L 68 44 C 68 33 77 24 80 24 Z" fill="url(#cl-docGrad)"/>

  <!-- Cyan edge glow on doc border -->
  <path d="M 80 24 L 348 24 L 444 120 L 444 492 C 444 503 435 512 424 512 L 88 512 C 77 512 68 503 68 492 L 68 44 C 68 33 77 24 80 24 Z"
    fill="none" stroke="#22d3ee" stroke-width="4" filter="url(#cl-edgeGlow)" opacity="0.7"/>

  <!-- Folded corner -->
  <path d="M 348 24 L 348 120 L 444 120 Z" fill="url(#cl-foldGrad)"/>
  <!-- Fold edge highlight -->
  <path d="M 348 24 L 444 120" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>

  <!-- Neural network dots (subtle) -->
  <circle cx="140" cy="200" r="3" fill="#22d3ee" opacity="0.25"/>
  <circle cx="230" cy="160" r="3" fill="#22d3ee" opacity="0.2"/>
  <circle cx="350" cy="200" r="3" fill="#22d3ee" opacity="0.25"/>
  <circle cx="310" cy="280" r="3" fill="#22d3ee" opacity="0.2"/>
  <circle cx="170" cy="310" r="3" fill="#22d3ee" opacity="0.2"/>
  <line x1="140" y1="200" x2="230" y2="160" stroke="#22d3ee" stroke-width="1" opacity="0.12"/>
  <line x1="230" y1="160" x2="350" y2="200" stroke="#22d3ee" stroke-width="1" opacity="0.12"/>
  <line x1="140" y1="200" x2="170" y2="310" stroke="#22d3ee" stroke-width="1" opacity="0.12"/>
  <line x1="350" y1="200" x2="310" y2="280" stroke="#22d3ee" stroke-width="1" opacity="0.12"/>

  <!-- J letter (white + ice-blue glow) -->
  <text x="185" y="360"
    font-family="'Arial Black','Impact','Helvetica Neue',Arial,sans-serif"
    font-size="210" font-weight="900"
    fill="white" text-anchor="middle"
    filter="url(#cl-jGlow)">J</text>

  <!-- A letter (amber + orange glow) -->
  <text x="348" y="360"
    font-family="'Arial Black','Impact','Helvetica Neue',Arial,sans-serif"
    font-size="210" font-weight="900"
    fill="#fbbf24" text-anchor="middle"
    filter="url(#cl-aGlow)">A</text>

  <!-- Center orb backdrop -->
  <circle cx="258" cy="285" r="18" fill="#22d3ee" filter="url(#cl-orbGlow)" opacity="0.6"/>
  <!-- Orb -->
  <circle cx="258" cy="285" r="11" fill="#06b6d4"/>
  <circle cx="258" cy="285" r="5.5" fill="#e0f9fe"/>
  <circle cx="256" cy="283" r="2.5" fill="white"/>

  <!-- PDF label at bottom -->
  <text x="256" y="480"
    font-family="Arial,'Helvetica Neue',sans-serif"
    font-size="68" font-weight="bold"
    fill="white" text-anchor="middle"
    letter-spacing="8" opacity="0.88">PDF</text>
</svg>
