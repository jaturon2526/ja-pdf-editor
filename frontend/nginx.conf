# ---------- จำกัดความถี่ต่อ IP (ชั้นนอก — ชั้นต่อบัญชีอยู่ใน backend app/core/ratelimit.py) ----------
# IP จริงของผู้ใช้: ถ้ามี reverse proxy ในเครือข่ายภายใน/Docker อยู่หน้าเรา (เช่น nginx TLS ของ on-premise)
# ใช้ IP จาก X-Forwarded-For แทน IP ของ proxy — เชื่อเฉพาะ proxy ในเครือข่ายส่วนตัว (คนภายนอกปลอม header ไม่ได้)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# เข้าสู่ระบบ / สมัคร / ลืมรหัสผ่าน: 20 ครั้ง/นาทีต่อ IP (กระชากได้ 20) — คนปกติไม่ถึง · บอทเดารหัสโดนตัด
limit_req_zone $binary_remote_addr zone=auth_ip:10m rate=20r/m;
# API ทั้งหมด: 50 คำขอ/วินาทีต่อ IP (กระชากได้ 200) — กันยิงถล่มจากเครื่องเดียว · ออฟฟิศที่ใช้ IP ร่วมกัน 100+ คนยังไม่ถึง
limit_req_zone $binary_remote_addr zone=api_ip:20m rate=50r/s;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 60M;

    # บีบอัดไฟล์ข้อความ — สำคัญกับ OpenCV.js ของหน้าสแกน (~10 MB → ~3.4 MB)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

    # ไฟล์ใน /assets/ มี hash ในชื่อ — cache ระยะยาวได้ (โหลด OpenCV.js ครั้งเดียวต่อเวอร์ชัน)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # หน้าเอกสารสาธารณะ (ไม่ต้องเข้าสู่ระบบ) — /privacy, /terms → privacy.html, terms.html
    location ~ ^/(privacy|terms)/?$ {
        try_files /$1.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ถึงเพดาน → 429 เป็น JSON ภาษาไทย (frontend แสดง detail)
    error_page 429 = @too_many;
    location @too_many {
        default_type application/json;
        add_header Retry-After 30 always;
        return 429 '{"detail":"มีคำขอจากเครือข่ายของคุณถี่เกินไป กรุณารอสักครู่แล้วลองใหม่"}';
    }

    location ~ ^/api/auth/(login|register|forgot-password|reset-password|resend-verification|google|line/) {
        limit_req zone=auth_ip burst=20 nodelay;
        limit_req zone=api_ip burst=200 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_ip burst=200 nodelay;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
