# Security headers ของทุกคำตอบ (หน้าเว็บและ /api/) = พื้นฐาน + Content-Security-Policy
# nginx: location ที่มี add_header ของตัวเองจะ "ไม่สืบทอด" add_header ของ server → ต้อง include ไฟล์นี้ซ้ำใน location นั้นด้วย
include /etc/nginx/snippets/security-headers-base.conf;

# CSP (SEC-04) — ถ้ามีช่อง XSS สคริปต์จากที่อื่น/inline ก็รันไม่ได้ ขโมย token ใน localStorage ส่งออกนอกไม่ได้:
#   script   เฉพาะไฟล์ของเรา + Google Sign-In (ห้าม inline/eval — index.html / manual.html ใช้ไฟล์ .js แยก)
#   style    'unsafe-inline' จำเป็น: @font-face ที่ inject ตอนพรีวิวฟอนต์ และ style ของ React/Google Sign-In
#   img      https: = รูปโปรไฟล์จาก Google/LINE · data:/blob: = ภาพหน้าเอกสาร/พรีวิวรูป
#   frame/object blob: = iframe สั่งพิมพ์ PDF (ตัวแสดง PDF ของ Chrome เป็น plugin) · worker blob: = เผื่อ worker จาก blob
#   frame-ancestors 'self' = แทน X-Frame-Options ในเบราว์เซอร์ใหม่ · ไม่ใส่ upgrade-insecure-requests (on-prem แบบ http ล้วน)
# เพิ่มบริการภายนอกใหม่ฝั่งหน้าเว็บ → ต้องเพิ่มโดเมนที่นี่ ไม่งั้นถูกบล็อก (ดู Console: "Refused to ...")
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com/gsi/; frame-src 'self' blob: https://accounts.google.com/gsi/; worker-src 'self' blob:; media-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
