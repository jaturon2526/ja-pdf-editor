# SonarQube Community Build + PostgreSQL สำหรับสแกนคุณภาพโค้ด (รันบนเครื่องพัฒนา ไม่ใช่ production)
# ใช้ผ่านสคริปต์:  scripts/sonar.sh up | scan | status | logs | down   (สร้าง .env.sonar ให้เองครั้งแรก)
# หรือเอง:  docker compose -p sonar --env-file .env.sonar -f docker-compose.sonar.yml up -d
#           docker compose -p sonar --env-file .env.sonar -f docker-compose.sonar.yml --profile scan run --rm scanner
# ต้องให้ Docker ใช้ RAM ได้ ≥ 4 GB (Docker Desktop › Settings › Resources) · Linux ต้อง vm.max_map_count ≥ 262144
name: sonar

services:
  sonarqube:
    image: ${SONARQUBE_IMAGE:-docker.io/library/sonarqube:26.11.0.134175-community}
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # เปิดเฉพาะเครื่องตัวเอง — อยากให้เครื่องอื่นในวงแลนเข้าได้ ตั้ง SONAR_BIND=0.0.0.0:9000 ใน .env.sonar
    ports:
      - "${SONAR_BIND:-127.0.0.1:9000}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?ตั้ง SONAR_DB_PASSWORD ใน .env.sonar (scripts/sonar.sh สร้างให้)}
      # ไม่ตรวจ bootstrap ของ Elasticsearch (เครื่องพัฒนา/Docker Desktop) — ไม่ต้องแก้ค่าเคอร์เนลเพิ่ม
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
      SONAR_TELEMETRY_ENABLE: "false"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  db:
    image: docker.io/library/postgres:17-alpine
    container_name: sonarqube_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?ตั้ง SONAR_DB_PASSWORD ใน .env.sonar (scripts/sonar.sh สร้างให้)}
      POSTGRES_DB: sonar
    volumes:
      - sonar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # ตัวสแกน — รันเฉพาะตอนสั่ง (profile scan) อ่านค่าจาก sonar-project.properties ที่รากโปรเจกต์
  scanner:
    profiles: ["scan"]
    image: ${SONAR_SCANNER_IMAGE:-docker.io/sonarsource/sonar-scanner-cli:latest}
    # scripts/sonar.sh scan รอจน SonarQube ตอบ UP ก่อนเริ่มตัวนี้
    depends_on:
      - sonarqube
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      # ปิด SCM (git blame) เป็นค่าเริ่มต้น: JGit ใน scanner อ่าน .git ที่ bind mount จาก Mac ไม่ครบ
      # → "MissingObjectException: Missing blob" ทั้งที่ git ปกติอ่านได้ · เปิดคืนด้วย SONAR_SCANNER_OPTS= (ว่าง) ใน .env.sonar
      SONAR_SCANNER_OPTS: ${SONAR_SCANNER_OPTS--Dsonar.scm.disabled=true}
    volumes:
      - ./:/usr/src
      - sonar_scanner_cache:/opt/sonar-scanner/.sonar/cache

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_pgdata:
  sonar_scanner_cache:
