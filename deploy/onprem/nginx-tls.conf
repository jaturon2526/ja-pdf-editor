# HTTPS หน้าเว็บ (docker-compose.onprem-tls.yml) — รับ 443 ด้วยใบรับรองขององค์กร แล้วส่งต่อให้ nginx หน้าเว็บ (frontend:8080)
# พอร์ต 80 ส่งต่อไป https เสมอ

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # เท่ากับ frontend/nginx.conf (อัปโหลดไฟล์ได้ถึง 60 MB, งานแปลง/OCR ใช้เวลานาน)
    client_max_body_size 60M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
    }
}
