# ใช้กับคำสั่ง alembic จาก CLI (รันใน backend/) — URL ฐานข้อมูลอ่านจาก DATABASE_URL เสมอ (ดู app/db/alembic/env.py)
# แอปรัน migration ให้เองตอน start (app/db/migrations.py) ไม่ต้องสั่ง upgrade เองตอน deploy
[alembic]
script_location = app/db/alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
