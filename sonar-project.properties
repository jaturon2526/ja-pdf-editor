sonar.projectKey=pdf_editor_fullstack
sonar.projectName=PDF Editor Fullstack
sonar.sourceEncoding=UTF-8

# กำหนดโฟลเดอร์ Source Code และ Test
sonar.sources=backend/app,frontend/src,backend/Dockerfile,frontend/Dockerfile
sonar.tests=backend/tests

# รองรับการสแกนโค้ด Python, JS/React และ Infrastructure as Code (IaC)
sonar.inclusions=**/*.py,**/*.js,**/*.jsx,**/*.yaml,**/*.yml,**/Dockerfile

# การตั้งค่าเฉพาะภาษา (บังคับวิเคราะห์ Coverage จาก Step 2)
sonar.python.version=3.11
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml

# กำหนด Quality Gate ขั้นต่ำ (บังคับผ่าน A Rating)
sonar.qualitygate.wait=true
